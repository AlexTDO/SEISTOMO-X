[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seistomo-x"
version = "0.1.0"
description = "A hybrid physics-neural platform for seismic inversion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Alex Tito", email = "alextdo.geophysics@gmail.com" }
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "h5py>=3.9",
    "matplotlib>=3.7",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
]
cuda = [
    "cupy-cuda12x>=12.0",
]

[project.urls]
Homepage = "https://github.com/AlexTDO/SEISTOMO-X"
Repository = "https://github.com/AlexTDO/SEISTOMO-X"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=seistomo --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"